name: ci

on:
  push:
    branches: [develop, release/*]
  # Pull requests to master are retargeted to develop. Checking them from the start gives them the checks that
  # develop requires, because a base change alone does not trigger new runs.
  pull_request:
    branches: [master, develop, release/*]

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Setup taplo
        uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2

      - name: Setup tombi
        uses: tombi-toml/setup-tombi@336fd5f0db887ebf637389a659b4193608756ecd # v1.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate TOML configs and themes with taplo
        run: taplo check

      - name: Validate TOML configs and themes with tombi
        run: tombi lint

      - name: Install latest nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --check --verbose --all

      - name: markdownlint-cli2-action
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

      - name: Run Check
        run: cargo check --locked --workspace

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --verbose --benches

      - name: Check for uncommitted changes after build
        run: |
          # Ensure that build.rs doesn't produce uncommitted changes
          # This catches cases where:
          # - Theme files are out of sync with schema version
          # - Generated files weren't committed
          # - Build scripts modified source files

          # Check for modified files
          if ! git diff --exit-code; then
            echo "::error::Build produced uncommitted changes to tracked files"
            echo "The following files were modified during build:"
            git diff --name-only
            echo ""
            echo "Diff:"
            git diff
            echo ""
            echo "Please run 'cargo build' locally and commit the changes."
            exit 1
          fi

          # Check for untracked files (excluding target/ and other build artifacts)
          UNTRACKED=$(git ls-files --others --exclude-standard | grep -v '^target/' | grep -v '\.build/' || true)
          if [ -n "$UNTRACKED" ]; then
            echo "::error::Build produced untracked files"
            echo "The following untracked files were created during build:"
            echo "$UNTRACKED"
            echo ""
            echo "Please run 'cargo build' locally and commit any generated files."
            exit 1
          fi

          echo "✓ No uncommitted changes produced by build"

      - name: Run tests
        run: cargo test --locked --workspace --verbose

      - name: Run executable
        run: cargo run --locked

  stress-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --release

      # The perf-gate job measures this build too.
      - name: Upload release build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hl-release
          path: target/release/hl
          retention-days: 1

      # Only the quick profile runs here, it is meant to take under a minute.
      - name: Run stress tests
        timeout-minutes: 2
        run: scripts/stress-test.py --hl target/release/hl --profile quick

  # Compares the instruction counts of the release build with those of its base, see scripts/README.md. On pushes, it
  # keeps the release build, so that pull requests based on that commit do not have to build their base.
  perf-gate:
    needs: stress-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      # For pull requests, the merge commit and its first parent, the base it is compared with.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Download release build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hl-release
          path: target/release

      - name: Find the base
        id: base
        run: |
          chmod +x target/release/hl
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          else
            mkdir -p target/perf-gate
            cp target/release/hl "target/perf-gate/hl-$GITHUB_SHA"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # Saved at the end of the job when missing: on pushes the release build, in pull requests a base build made by
      # the script, which only that pull request can use.
      - name: Cache base build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/perf-gate/hl-${{ steps.base.outputs.sha }}
          key: perf-gate-base-${{ steps.base.outputs.sha }}

      # Without the libc debug symbols it depends on: they must match the libc version exactly, so installing them
      # upgrades libc, which takes most of the time, and cachegrind counts without them. The package lists of the runner
      # image are usually recent enough, they are updated only when downloading from them fails.
      - name: Install valgrind
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}
        run: |
          apt-get download -q valgrind || { sudo apt-get update -q && apt-get download -q valgrind; }
          sudo dpkg -i --ignore-depends=libc6-dbg valgrind_*.deb

      - name: Compare instruction counts with the base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The label is read here rather than from the event, so that re-running the job after adding it takes effect.
          args=()
          if gh pr view "$PR" --json labels -q '.labels[].name' | grep -qx perf-regression-accepted; then
            args+=(--report-only)
          fi
          scripts/perf-gate.py --base HEAD^1 --hl target/release/hl --markdown perf-gate.md "${args[@]}"

      # Also when the check fails. Pull requests from forks get a read-only token, they have the job summary only.
      - name: Report instruction counts
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('perf-gate.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          cat perf-gate.md >> "$GITHUB_STEP_SUMMARY"
          if [[ "$FORK" == true ]]; then
            exit 0
          fi
          # One comment per pull request, updated on each run.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- perf-gate -->"))) | .id' | head -n 1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@perf-gate.md > /dev/null
          else
            gh pr comment "$PR" --body-file perf-gate.md
          fi

  coverage:
    runs-on: ubuntu-latest

    env:
      # renovate: datasource=crate depName=rustfilt
      RUSTFILT_VERSION: "0.2.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install latest toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install coverage tools
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: rustfilt@${{ env.RUSTFILT_VERSION }}

      - name: Generate code coverage
        run: |
          make coverage

      - name: Upload coverage to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true

  test-nix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Cache Nix store
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: hl
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run nix flake check
        run: nix flake check --print-build-logs --all-systems --no-update-lock-file

      - name: Check Nix formatting
        run: |
          nix fmt --no-update-lock-file
          if ! git diff --exit-code; then
            echo "Nix files are not formatted correctly"
            exit 1
          fi

      - name: Run nix build
        run: nix build --print-build-logs --no-update-lock-file
