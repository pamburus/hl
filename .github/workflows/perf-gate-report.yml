---
name: Report instruction counts

# The perf-gate job of the CI workflow compares the instruction counts of a pull request with those of its base, and
# saves the report as an artifact. This job posts the report as a comment on the pull request, updated on each run.
#
# It runs separately because the CI workflow of a pull request from a fork gets a read-only token, which cannot comment.
# A `workflow_run` job gets a token that can, so it never checks out or runs the code of the pull request, and it treats
# the artifact as untrusted: the pull request it names must have the commit that the CI run checked as its head.
#
# The `workflow_run` trigger runs from master, so changes to this workflow take effect with a release.

"on":
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

# Keeps two runs for one pull request from both creating the comment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-26.04

    steps:
      - name: Post the report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DIR: ${{ runner.temp }}/perf-gate-report
        run: |
          # The perf-gate job makes no report when the run was cancelled or the release build failed.
          artifact=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            -q '.artifacts[] | select(.name == "perf-gate-report") | .id')
          if [[ -z "$artifact" ]]; then
            echo "The run has no instruction count report."
            exit 0
          fi
          gh run download "$RUN_ID" --repo "$REPO" --name perf-gate-report --dir "$DIR"

          pr=$(< "$DIR/pr")
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::The report names an invalid pull request: $pr"
            exit 1
          fi
          # Also skips reports of runs that a newer push to the pull request has made outdated.
          head=$(gh api "repos/$REPO/pulls/$pr" -q .head.sha)
          if [[ "$head" != "$HEAD_SHA" ]]; then
            echo "The head of pull request $pr is $head, not $HEAD_SHA checked by the run, so the report is not posted."
            exit 0
          fi

          # One comment per pull request, updated on each run.
          id=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- perf-gate -->"))) | .id' | head -n 1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$DIR/perf-gate.md" > /dev/null
          else
            gh pr comment "$pr" --repo "$REPO" --body-file "$DIR/perf-gate.md"
          fi
