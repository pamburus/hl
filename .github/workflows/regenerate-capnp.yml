---
name: Regenerate Cap'n Proto bindings

# The generated Cap'n Proto bindings are checked in, and the code they contain is tied to both the
# `capnpc` crate and the Cap'n Proto compiler that produced them — each records its version in the
# generated header. A dependency update that moves `capnpc` therefore leaves the checked-in sources
# stale, and the build script refuses to accept them. When Renovate or a lockfile workflow
# pushes a dependency update, this job regenerates stale bindings on the same branch.
#
# The compiler comes from the nixpkgs revision pinned in `flake.lock` rather than from the runner
# image, because its version is embedded verbatim in the generated output. An unpinned compiler would
# rewrite that header whenever the image changed. `just regenerate-capnp` runs the same script
# against the same pinned compiler, so a contributor reproducing this locally gets the same bytes.

"on":
  push:
    branches:
      - "update-*"
      - "renovate/**"
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "flake.lock"
      - "rust-toolchain.toml"
      - "build.rs"
      - "**/*.capnp"
      - "contrib/bin/regenerate-capnp.sh"
      - ".github/workflows/regenerate-capnp.yml"

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate Cap'n Proto bindings
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          cache: false

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Cache Nix store
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: hl

      - name: Regenerate bindings
        env:
          CARGO_TARGET_DIR: target
        run: nix shell --inputs-from . nixpkgs#capnproto --command contrib/bin/regenerate-capnp.sh

      - name: Save a patch for the trusted write-back workflow
        run: |
          git diff --no-ext-diff -- src/index_capnp.rs .build/capnp/index.capnp.json > "$RUNNER_TEMP/capnp.patch"
          if [[ ! -s "$RUNNER_TEMP/capnp.patch" ]]; then
            rm "$RUNNER_TEMP/capnp.patch"
          fi

      - name: Upload generated patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capnp-patch
          path: ${{ runner.temp }}/capnp.patch
          if-no-files-found: ignore
          retention-days: 1
