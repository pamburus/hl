---
name: Prepare dependency update

# The generated Cap'n Proto bindings are checked in, and the code they contain is tied to both the
# `capnpc` crate and the Cap'n Proto compiler that produced them — each records its version in the
# generated header. A dependency update that moves `capnpc` therefore leaves the checked-in sources
# stale, and the build script refuses to accept them. This job generates a patch and requests
# a release-line version bump when the update affects the built program.
#
# The compiler comes from the nixpkgs revision pinned in `flake.lock` rather than from the runner
# image, because its version is embedded verbatim in the generated output. An unpinned compiler would
# rewrite that header whenever the image changed. `just regenerate-capnp` runs the same script
# against the same pinned compiler, so a contributor reproducing this locally gets the same bytes.

"on":
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [develop, "release/**"]

permissions:
  contents: read

jobs:
  regenerate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.user.login == 'renovate[bot]' && startsWith(github.head_ref, 'renovate/')) ||
       (github.event.pull_request.user.login == 'missionis[bot]' && startsWith(github.head_ref, 'update-')))
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          cache: false

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check for a release-line version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-update"
          base=$(git merge-base "$BASE_SHA" HEAD)
          request=$(python3 scripts/dependency-version.py prepare "$base")
          if [[ -n "$request" ]]; then
            printf '%s\n' "$request" > "$RUNNER_TEMP/dependency-update/version-base"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Cache Nix store
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: hl

      - name: Regenerate bindings
        env:
          CARGO_TARGET_DIR: target
        run: nix shell --inputs-from . nixpkgs#capnproto --command contrib/bin/regenerate-capnp.sh

      - name: Save a patch for the trusted write-back workflow
        run: |
          patch="$RUNNER_TEMP/dependency-update/capnp.patch"
          git diff --no-ext-diff -- src/index_capnp.rs .build/capnp/index.capnp.json > "$patch"
          if [[ ! -s "$patch" ]]; then
            rm "$patch"
          fi

      - name: Upload dependency update artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-update
          path: ${{ runner.temp }}/dependency-update/
          if-no-files-found: ignore
          retention-days: 1
