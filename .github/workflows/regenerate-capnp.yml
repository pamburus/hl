---
name: Regenerate Cap'n Proto bindings

# The generated Cap'n Proto bindings are checked in, and the code they contain is tied to both the
# `capnpc` crate and the Cap'n Proto compiler that produced them — each records its version in the
# generated header. A dependency update that moves `capnpc` therefore leaves the checked-in sources
# stale, and the build script refuses to accept them. When Renovate or a lockfile workflow
# pushes a dependency update, this job regenerates stale bindings on the same branch.
#
# The compiler comes from the nixpkgs revision pinned in `flake.lock` rather than from the runner
# image, because its version is embedded verbatim in the generated output. An unpinned compiler would
# rewrite that header whenever the image changed. `just regenerate-capnp` runs the same script
# against the same pinned compiler, so a contributor reproducing this locally gets the same bytes.

"on":
  push:
    branches:
      - "update-*"
      - "renovate/**"

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate Cap'n Proto bindings
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install latest toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Cache Nix store
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: hl
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Regenerate bindings
        env:
          CARGO_TARGET_DIR: target
        run: nix shell --inputs-from . nixpkgs#capnproto --command contrib/bin/regenerate-capnp.sh

      - name: Check whether bindings changed
        id: bindings-status
        run: |
          if git diff --quiet -- src/index_capnp.rs .build/capnp; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated bindings are already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App Token
        if: steps.bindings-status.outputs.changed == 'true'
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Commit and push regenerated bindings
        if: steps.bindings-status.outputs.changed == 'true'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git config user.name "missionis[bot]"
          git config user.email "234988995+missionis[bot]@users.noreply.github.com"
          git add -- src/index_capnp.rs .build/capnp
          git commit -m "build(capnp): regenerate bindings for the updated toolchain"
          gh auth setup-git
          git push origin HEAD:"refs/heads/${BRANCH_NAME}"
