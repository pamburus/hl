name: Build

on:
  workflow_call:
    inputs:
      release:
        description: "Release tag or identifier"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to build from"
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      CARGO: cargo
      # renovate: datasource=crate depName=cross
      CROSS_VERSION: "0.2.5"

    strategy:
      matrix:
        name:
          - linux-x86-gnu
          - linux-x86-musl
          - linux-arm-gnu
          - linux-arm-musl
          - macos-x86
          - macos-arm
          - macos-universal
          - windows-x86
          - windows-arm
        include:
          - name: linux-x86-gnu
            os: ubuntu-26.04
            family: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            archiver: tar.gz
            asset: hl-linux-x86_64-gnu.tar.gz
            cross: true
          - name: linux-x86-musl
            os: ubuntu-26.04
            family: linux
            arch: x86_64
            target: x86_64-unknown-linux-musl
            archiver: tar.gz
            asset: hl-linux-x86_64-musl.tar.gz
            cross: true
          - name: linux-arm-gnu
            os: ubuntu-26.04
            family: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            archiver: tar.gz
            asset: hl-linux-arm64-gnu.tar.gz
            cross: true
          - name: linux-arm-musl
            os: ubuntu-26.04
            family: linux
            arch: aarch64
            target: aarch64-unknown-linux-musl
            archiver: tar.gz
            asset: hl-linux-arm64-musl.tar.gz
            cross: true
          - name: macos-x86
            os: macos-26
            family: macos
            arch: x86_64
            target: x86_64-apple-darwin
            archiver: tar.gz
            asset: hl-macos-x86_64.tar.gz
          - name: macos-arm
            os: macos-26
            family: macos
            arch: aarch64
            target: aarch64-apple-darwin
            archiver: tar.gz
            asset: hl-macos-arm64.tar.gz
          - name: macos-universal
            os: macos-26
            family: macos
            arch: "{aarch64,x86_64}"
            target: "{aarch64,x86_64}-apple-darwin"
            archiver: tar.gz
            asset: hl-macos.tar.gz
            universal: true
          - name: windows-x86
            os: windows-2025
            family: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            archiver: 7z
            asset: hl-windows.zip
          - name: windows-arm
            os: windows-2025
            family: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc
            archiver: 7z
            asset: hl-windows-arm64.zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
          # Cross containers can require different host libraries for build scripts.
          cache-key: ${{ matrix.os }}-${{ matrix.name }}-${{ inputs.release != '' && 'release' || 'rehearsal' }}

      - name: Install Cross
        if: matrix.cross
        run: |
          cargo install --locked "cross@${CROSS_VERSION:?}"
          echo "CARGO=cross" >> $GITHUB_ENV

      - name: Add Target
        if: matrix.cross == false && matrix.target != ''
        run: |
          rustup target add ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          # Cross forwards CARGO_* variables to Cargo inside the build container.
          if [[ -z "$RELEASE_TAG" ]]; then
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=0
            export CARGO_PROFILE_RELEASE_LTO=off
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          fi
          echo ${{ matrix.target }} | xargs -n 1 ${{ env.CARGO }} build --release --locked --verbose --target

      - name: Verify Linux x86-64 glibc compatibility
        if: matrix.name == 'linux-x86-gnu'
        shell: bash
        run: |
          max_glibc=2.18
          required=$(readelf --version-info --wide target/x86_64-unknown-linux-gnu/release/hl |
            sed -nE 's/.*Name: GLIBC_([0-9]+(\.[0-9]+)+).*/\1/p' | sort -V | tail -1)
          if [[ "$(printf '%s\n' "${required:?}" "$max_glibc" | sort -V | tail -1)" != "$max_glibc" ]]; then
            echo "::error::binary requires glibc ${required}, newer than ${max_glibc}"
            exit 1
          fi

      - name: Sign
        if: matrix.family == 'macos'
        run: codesign --force --deep --sign - ./target/${{ matrix.target }}/release/hl

      - name: Package using `tar`
        if: matrix.archiver == 'tar.gz' && matrix.universal == false
        run: tar -C ./target/${{ matrix.target }}/release -cz -f ${{ matrix.asset }} hl

      - name: Package using `7z`
        if: matrix.archiver == '7z' && matrix.universal == false
        run: 7z a ${{ matrix.asset }} .\target\${{ matrix.target }}\release\hl.exe

      - name: Make universal binary
        if: matrix.family == 'macos' && matrix.universal == true
        run: lipo ./target/${{ matrix.target }}/release/hl -create -output ./target/hl

      - name: Package universal binary using `tar`
        if: matrix.archiver == 'tar.gz' && matrix.universal == true
        run: tar -C ./target -cz -f ${{ matrix.asset }} hl

      - name: Upload binaries to release
        if: inputs.release != ''
        run: |
          gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
