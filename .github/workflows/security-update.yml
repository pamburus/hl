name: Fix vulnerable dependencies

# Renovate updates direct dependencies. Other crates in the lockfile change only to fix a known vulnerability.
on:
  schedule:
    - cron: "00 17 * * *" # Every day at 17:00 UTC
  workflow_dispatch:

concurrency:
  # Scheduled runs and manual runs targeting develop share the same group.
  group: security-update-${{ (github.event_name == 'schedule' || github.ref_name == 'master') && 'develop' || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  fix-vulnerabilities:
    name: Fix vulnerable dependencies
    runs-on: ubuntu-26.04
    env:
      # Scheduled runs and dispatches on master target develop. Dispatches on release branches target that line.
      TARGET_BRANCH: ${{ (github.event_name == 'schedule' || github.ref_name == 'master') && 'develop' || github.ref_name }}
      # renovate: datasource=crate depName=cargo-audit
      CARGO_AUDIT_VERSION: "0.23.0"
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Update vulnerable crates
        id: update
        run: |
          ./scripts/cargo-audit-fix.sh 2> >(tee /dev/stderr) | ./scripts/cargo-update-filter.sh > /tmp/cargo-update.log
          echo "log=$(jq -Rs . < /tmp/cargo-update.log)" >> ${GITHUB_OUTPUT}
          echo "table=$(./scripts/cargo-update-to-table.sh < /tmp/cargo-update.log | jq -Rs .)" >> ${GITHUB_OUTPUT}
          if cargo audit; then
            echo "resolved=true" >> ${GITHUB_OUTPUT}
          else
            echo "resolved=false" >> ${GITHUB_OUTPUT}
          fi

      - name: Choose pull request branch
        id: pr-branch
        run: echo "name=update-security-${TARGET_BRANCH//\//-}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: |
            build(deps): fix vulnerable dependencies

            ${{ fromJSON(steps.update.outputs.log) }}
          base: ${{ env.TARGET_BRANCH }}
          branch: ${{ steps.pr-branch.outputs.name }}
          title: "build(deps): fix vulnerable dependencies"
          body: |
            Updates crates with known vulnerabilities to the latest versions per Cargo.toml constraints.

            ${{ fromJSON(steps.update.outputs.table) }}
          author: "missionis[bot] <234988995+missionis[bot]@users.noreply.github.com>"
          committer: "missionis[bot] <234988995+missionis[bot]@users.noreply.github.com>"
          labels: |
            dependencies
            rust
            security
          delete-branch: true

      # A fix that needs an incompatible version cannot be applied automatically
      - name: Fail on remaining vulnerabilities
        if: steps.update.outputs.resolved == 'false'
        run: |
          echo "::error::vulnerabilities remain after the update"
          exit 1
