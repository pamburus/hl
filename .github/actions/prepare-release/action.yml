name: Prepare release
description: Set the release version and generate release notes locally
inputs:
  release-type:
    description: Version component to bump
    required: true
outputs:
  version:
    description: The new package version
    value: ${{ steps.update-version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        rustflags: ""

    - name: Install cargo-quickinstall
      env:
        # renovate: datasource=crate depName=cargo-quickinstall
        CARGO_QUICKINSTALL_VERSION: "0.3.53"
      shell: bash
      run: cargo install --locked "cargo-quickinstall@${CARGO_QUICKINSTALL_VERSION:?}"

    - name: Install cargo-edit
      env:
        # renovate: datasource=crate depName=cargo-edit
        CARGO_EDIT_VERSION: "0.13.13"
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
      run: cargo quickinstall --force --version "${CARGO_EDIT_VERSION:?}" cargo-edit

    - name: Update version in Cargo.toml
      id: update-version
      env:
        RELEASE_TYPE: ${{ inputs.release-type }}
      shell: bash
      run: |
        cargo set-version --package hl --bump "${RELEASE_TYPE:?}"
        VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hl") | .version')
        echo "version=${VERSION?}" >> $GITHUB_OUTPUT

    - name: Install git-cliff
      env:
        # renovate: datasource=github-releases depName=orhun/git-cliff extractVersion=^v(?<version>.+)$
        GIT_CLIFF_VERSION: "2.12.0"
      shell: bash
      run: |
        # Install git-cliff for generating release notes
        curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION:?}/git-cliff-${GIT_CLIFF_VERSION:?}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
        sudo mv git-cliff-*/git-cliff /usr/local/bin/
        git-cliff --version

    - name: Generate release notes
      id: release-notes
      shell: bash
      run: |
        VERSION=${{ steps.update-version.outputs.version }}
        PREVIOUS_TAG=$(git tag -l "v*.*.*" --merged HEAD --sort=-version:refname | head -1 || echo "")
        git-cliff --tag "v${VERSION:?}" --output RELEASE_NOTES.md --verbose "${PREVIOUS_TAG:?}..HEAD"
      env:
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}
