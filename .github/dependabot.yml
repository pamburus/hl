# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "build"
      include: "scope"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "18:00"
      timezone: "Etc/UTC"
    allow:
      - dependency-type: direct
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # capnp and capnpc must move together: the runtime and the code generator share a release
      # cadence, and a version skew between them leaves the committed generated bindings unable to
      # compile against the runtime.
      capnp:
        patterns:
          - "capnp"
          - "capnpc"
      # Patch releases are batched into a single pull request rather than suppressed, so the fixes
      # still land without one pull request per crate.
      patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      - dependency-name: "anstream"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "anyhow"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "assert_matches"
        update-types: ["version-update:semver-minor"]
      # 0.2.0 stopped parsing bare month names such as `january`, which `--since` and `--until` accept.
      # Reported upstream as stevedonovan/chrono-english#38; the release is also absent from the
      # project repository (stevedonovan/chrono-english#39). Later releases are still offered.
      - dependency-name: "chrono-english"
        versions: ["0.2.0"]
      - dependency-name: "clap"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "clap_complete"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "const-str"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "derive_more"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "dirs"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "enum-map"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "enumset"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "flate2"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "fnv"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "humantime"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "itoa"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "known-folders"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "kqueue"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "maplit"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "memchr"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "notify"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "num_cpus"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "once_cell"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "owo-colors"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pest"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pest_derive"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "regex"
