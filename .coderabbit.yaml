# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    # Pull requests target release lines, not the default branch `master`.
    base_branches:
      - "develop"
      - "release/.*"
    # Dependency update pull requests are checked by CI.
    ignore_usernames:
      - "dependabot[bot]"
      - "missionis[bot]"
  path_filters:
    # Generated from the Cap'n Proto schema.
    - "!src/index_capnp.rs"
knowledge_base:
  code_guidelines:
    # AGENTS.md only points to these documents, so list them directly.
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - ".specify/memory/constitution.md"
      - "docs/guidelines/*.md"
