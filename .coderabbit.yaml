# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    # Pull requests target release lines, not the default branch `master`.
    base_branches:
      - "develop"
      - "release/.*"
    # Dependency update pull requests are checked by CI.
    ignore_usernames:
      - "renovate[bot]"
      - "missionis[bot]"
  path_filters:
    # Generated from the Cap'n Proto schema.
    - "!src/index_capnp.rs"
    # Spec Kit installs these skills, shared files and integration records.
    - "!.specify/.gitignore"
    - "!.specify/scripts/bash/check-prerequisites.sh"
    - "!.specify/scripts/bash/common.sh"
    - "!.specify/scripts/bash/create-new-feature.sh"
    - "!.specify/scripts/bash/markdown_sections.py"
    - "!.specify/scripts/bash/resolve-template.sh"
    - "!.specify/scripts/bash/setup-plan.sh"
    - "!.specify/scripts/bash/setup-tasks.sh"
    - "!.specify/templates/checklist-template.md"
    - "!.specify/templates/constitution-template.md"
    - "!.specify/templates/plan-template.md"
    - "!.specify/templates/spec-template.md"
    - "!.specify/templates/tasks-template.md"
    - "!.agents/skills/speckit-*/SKILL.md"
    - "!.claude/skills/speckit-*/SKILL.md"
    - "!.specify/integrations/*.manifest.json"
    - "!.specify/init-options.json"
    - "!.specify/integration.json"
knowledge_base:
  code_guidelines:
    # AGENTS.md only points to these documents, so list them directly.
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - ".specify/memory/constitution.md"
      - "docs/guidelines/*.md"
