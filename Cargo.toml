[package]
name = "hl"
version.workspace = true
edition.workspace = true
rust-version = "1.86.0"
description = "JSON and logfmt log converter to human readable representation"
repository.workspace = true
license.workspace = true
keywords = ["cli", "json", "log", "logfmt", "viewer"]
categories = ["command-line-utilities", "development-tools", "parsing", "text-processing"]
build = "build.rs"

[workspace]
members = [
  ".",
  "crates/encstr",
  "crates/enumset-ext",
  "crates/enumset-serde",
  "crates/heapopt",
  "crates/lifecycle",
  "crates/pager",
  "crates/serde-logfmt",
  "crates/styled-help",
  "crates/wildcard",
]

[workspace.dependencies]
anstream = "1"
anyhow = "1"
assert_matches = "1"
base32 = "0.5"
byte-strings = "0.3"
bytefmt = "0.1"
capnp = "0.27"
capnpc = "0.27"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-english = "0.2"
chrono-tz = { version = "0.10", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env", "string", "wrap_help"] }
clap_complete = { version = "4" }
clap_mangen = { git = "https://github.com/pamburus/rust-clap.git", rev = "20f0ffd737581a5ebf7479d2174f2c197f25c94d" }
clean-path = "0.2"
closure = "0.3"
collection_macros = "0.2"
color-print = "0.3"
config = { version = "0.15", features = ["json", "toml", "yaml"] }
const-str = "1"
criterion = "0.8"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
deko = "0.6"
derive-where = "1"
derive_more = { version = "2", features = ["deref", "deref_mut", "display", "eq", "from", "into", "into_iterator"] }
digest-io = "0.1"
dirs = "6"
dirs-sys = "0.5"
encstr = { path = "./crates/encstr" }
enum-map = "2"
enumset = "1"
enumset-ext = { path = "./crates/enumset-ext", features = ["clap", "serde"] }
enumset-serde = { path = "./crates/enumset-serde" }
env_logger = "0.11"
flate2 = "1"
fnv = "1"
heapless = "0.9"
heapopt = { path = "./crates/heapopt" }
hex = "0.4"
humantime = "2"
itertools = "0.15"
itoa = { version = "1", default-features = false }
json = { package = "serde_json", version = "1", features = ["raw_value"] }
known-folders = "1"
kqueue = "1"
libc = "0.2"
liblzma = { version = "*", features = ["static"] }
lifecycle = { path = "./crates/lifecycle" }
log = "0.4"
logos = "0.16"
maplit = "1"
memchr = "2"
mline = { path = "./crates/mline" }
mockall = "0.15"
more-asserts = "0"
nonzero_ext = "0.3"
notify = { version = "8", features = ["macos_kqueue"] }
num_cpus = "1"
once_cell = "1"
owo-colors = "4"
pager = { path = "./crates/pager" }
pest = "2"
pest_derive = "2"
proc-macro2 = "1"
quote = "1"
rand = "0.10"
regex = "1"
rstest = "0.26"
rust-embed = "8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde-logfmt = { path = "./crates/serde-logfmt" }
serde-value = "0.7"
serde_plain = "1"
sha2 = "0.11"
shellwords = "1"
signal-hook = "0.4"
snap = "1"
static_assertions = "1"
stats_alloc = "0.1"
strsim = "0.11"
strum = { version = "0.28", features = ["derive"] }
styled-help = { path = "./crates/styled-help" }
syn = { version = "3", features = ["extra-traits", "full"] }
terminal_size = "0.4"
thiserror = "2"
titlecase = "3"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
utf8-supported = "1"
which = "8"
wild = "2"
wildcard = { path = "crates/wildcard" }
wildmatch = "2"
winapi-util = { version = "0.1" }
wyhash = "0.6"
yaml = { package = "yaml-peg", version = "1" }

[workspace.package]
version = "0.36.3"
edition = "2024"
repository = "https://github.com/pamburus/hl"
license = "MIT"

[[bench]]
harness = false
name = "bench"

[dependencies]
anstream.workspace = true
bytefmt.workspace = true
capnp.workspace = true
chrono.workspace = true
chrono-english.workspace = true
chrono-tz.workspace = true
ciborium.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
closure.workspace = true
collection_macros.workspace = true
color-print.workspace = true
config.workspace = true
const-str.workspace = true
crossbeam-channel.workspace = true
