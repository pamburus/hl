crossbeam-utils.workspace = true
deko.workspace = true
derive_more.workspace = true
digest-io.workspace = true
dirs.workspace = true
dirs-sys.workspace = true
encstr.workspace = true
enum-map.workspace = true
enumset.workspace = true
enumset-ext.workspace = true
enumset-serde.workspace = true
env_logger.workspace = true
flate2.workspace = true
heapless.workspace = true
heapopt.workspace = true
hex.workspace = true
humantime.workspace = true
itertools.workspace = true
itoa.workspace = true
json.workspace = true
known-folders.workspace = true
liblzma.workspace = true
lifecycle.workspace = true
log.workspace = true
logos.workspace = true
memchr.workspace = true
mline.workspace = true
nonzero_ext.workspace = true
notify.workspace = true
num_cpus.workspace = true
once_cell.workspace = true
owo-colors.workspace = true
pager.workspace = true
pest.workspace = true
pest_derive.workspace = true
regex.workspace = true
rust-embed.workspace = true
serde = { workspace = true, features = ["rc"] }
serde-logfmt.workspace = true
serde_plain.workspace = true
serde-value.workspace = true
sha2.workspace = true
shellwords.workspace = true
signal-hook.workspace = true
snap.workspace = true
static_assertions.workspace = true
strsim.workspace = true
strum.workspace = true
styled-help.workspace = true
terminal_size.workspace = true
thiserror.workspace = true
titlecase.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
utf8-supported.workspace = true
which.workspace = true
wild.workspace = true
wildcard.workspace = true
winapi-util.workspace = true
wyhash.workspace = true
yaml.workspace = true

[dev-dependencies]
assert_matches.workspace = true
base32.workspace = true
byte-strings.workspace = true
clean-path.workspace = true
criterion.workspace = true
fnv.workspace = true
maplit.workspace = true
mockall.workspace = true
rand.workspace = true
regex.workspace = true
rstest.workspace = true
stats_alloc.workspace = true
wildmatch.workspace = true

[build-dependencies]
anyhow.workspace = true
capnpc.workspace = true
const-str.workspace = true
hex.workspace = true
json.workspace = true
semver.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true

# Use native-tls on Windows ARM64 to avoid ring/clang requirement
# Use rustls (default) on all other platforms
[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.build-dependencies]
ureq = { version = "3", default-features = false, features = ["gzip", "native-tls", "platform-verifier"] }

[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.build-dependencies]
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
kqueue.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
