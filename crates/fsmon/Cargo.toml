[package]
name = "fsmon"
version = "0.1.0"
edition.workspace = true
description = "Follows files by name across rotation, truncation and replacement"
repository.workspace = true
license.workspace = true

[dependencies]
log.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
notify.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
